<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quebra Galho">
<title>Recibo · Quebra Galho</title>
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="assets/app.css">
</head>
<body data-state='{"servico": "teto"}'>
<div class="desk">Versão de Computador ainda em Desenvolvimento.</div>
<div class="app">
  <header class="top">
    <a class="back" href="pedidos.html?aba=conc" data-back aria-label="Voltar"><i data-i="voltar"></i></a>
    <h1 class="title">Recibo</h1>
  </header>

  <main class="scroll">
    <div class="card" style="padding: 20px">
      <div class="between">
        <div class="hstack"><img src="assets/logo.png" alt="" width="36" height="36" style="border-radius: 9px"><span class="strong">Quebra Galho</span></div>
        <span class="tag ok">Pago</span>
      </div>
      <p class="small muted" style="margin-top: 18px">Valor pago</p>
      <p class="num" style="font-size: 34px" data-text="valor"></p>
      <div style="border-top: 1px dashed var(--campo); margin: 16px 0"></div>
      <div class="stack" style="gap: 12px; font-size: 15px">
        <div class="between"><span class="muted">Serviço</span><b data-text="nome"></b></div>
        <div class="between"><span class="muted">Profissional</span><b data-text="prof"></b></div>
        <div class="between"><span class="muted">Data do serviço</span><b data-text="data"></b></div>
        <div class="between"><span class="muted">Meio</span><b data-text="meio"></b></div>
        <div class="between"><span class="muted">Cliente</span><b>Daniela Santos</b></div>
        <div class="between"><span class="muted">Código</span><b>[CÓDIGO DA TRANSAÇÃO]</b></div>
      </div>
    </div>
    <p class="hint" style="margin-top: 12px">O pagamento foi intermediado pelo Quebra Galho e repassado ao profissional depois da sua confirmação de conclusão.</p>
  </main>

  <footer class="foot">
    <button type="button" class="btn-sec" onclick="this.querySelector('span').textContent = 'Recibo enviado para seu e-mail'"><i data-i="enviar" class="s"></i><span>Enviar por e-mail</span></button>
  </footer>
</div>
<script src="assets/app.js"></script>
<script>
App.computed = function (s) {
  return {
    teto: { valor: 'R$ 420,00', nome: 'Pintura do teto', prof: 'Wagner Lima', data: 'Qui, 6/11', meio: 'Pix' },
    chuveiro: { valor: 'R$ 150,00', nome: 'Instalação de chuveiro', prof: 'Rosa Antunes', data: '12/10', meio: 'Cartão · 1x' },
    pia: { valor: 'R$ 120,00', nome: 'Vazamento na pia', prof: 'Edson Paiva', data: '03/09', meio: 'Pix' }
  }[s.servico] || {};
};
</script>
</body>
</html>
